<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top 5 Books for 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="texture" aria-hidden="true"></div>
    <main class="layout">
      <header class="hero">
        <h1>My Bookshelf for 2026</h1>
        <p>
          Five thoughtful books I want to read this year. Click any spine to see what
          it is about, who wrote it, and track my progress.
        </p>
      </header>

      <section class="shelf-panel" aria-label="Bookshelf">
        <div id="shelf" class="shelf" role="listbox" aria-label="Select a book"></div>
      </section>

      <section id="details" class="details" aria-live="polite"></section>
    </main>

    <template id="details-template">
      <article>
        <p class="meta-line"><span id="book-year"></span> • <span id="book-genre"></span></p>
        <h2 id="book-title"></h2>
        <p class="author">by <span id="book-author"></span></p>
        <p id="book-summary"></p>
        <p id="book-why"></p>
        <div class="actions">
          <button id="read-toggle" type="button"></button>
          <a id="source-link" target="_blank" rel="noreferrer">Learn more</a>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
